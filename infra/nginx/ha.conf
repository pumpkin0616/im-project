events { worker_connections 8192; }

http {
    upstream im_http {
        least_conn;
        server app-a:8080 max_fails=2 fail_timeout=5s;
        server app-b:8080 max_fails=2 fail_timeout=5s;
        keepalive 128;
    }
    upstream im_websocket {
        least_conn;
        server app-a:18081 max_fails=2 fail_timeout=5s;
        server app-b:18081 max_fails=2 fail_timeout=5s;
    }
    server {
        listen 8080;
        client_max_body_size 30m;
        location / {
            proxy_pass http://im_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
    server {
        listen 18081;
        location /ws {
            proxy_pass http://im_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 90s;
        }
    }
}
