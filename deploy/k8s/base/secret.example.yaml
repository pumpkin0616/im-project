apiVersion: v1
kind: Secret
metadata:
  name: im-secrets
  namespace: im
type: Opaque
stringData:
  IM_DB_USERNAME: replace-me
  IM_DB_PASSWORD: replace-me
  IM_AUTH_JWT_SECRET: replace-with-at-least-32-random-bytes
  IM_GATEWAY_DISPATCH_SECRET: replace-with-random-secret
  IM_ROUTING_ADMIN_SECRET: replace-with-random-secret
  IM_LIFECYCLE_ADMIN_SECRET: replace-with-random-secret
