apiVersion: apps/v1
kind: Deployment
metadata:
  name: im-web
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: im-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: im-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/example/im-web:replace-with-immutable-tag
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
