spring:
  application:
    name: im-project
  datasource:
    url: ${IM_DB_URL:jdbc:mysql://127.0.0.1:3307/im_message?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${IM_DB_USERNAME:im_app}
    password: ${IM_DB_PASSWORD:im_app}
    hikari:
      maximum-pool-size: ${IM_DB_POOL_SIZE:16}
      minimum-idle: ${IM_DB_MIN_IDLE:2}
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    enabled: ${IM_FLYWAY_ENABLED:false}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${IM_HTTP_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB

spring.servlet.multipart:
  max-file-size: ${IM_MAX_ATTACHMENT_SIZE:25MB}
  max-request-size: ${IM_MAX_ATTACHMENT_SIZE:25MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

im:
  gateway:
    enabled: ${IM_GATEWAY_ENABLED:true}
    port: ${IM_GATEWAY_PORT:18081}
    public-url: ${IM_GATEWAY_PUBLIC_URL:ws://127.0.0.1:18081/ws}
    allowed-origins: ${IM_GATEWAY_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    ticket-ttl: ${IM_GATEWAY_TICKET_TTL:60s}
    heartbeat-interval: ${IM_GATEWAY_HEARTBEAT_INTERVAL:25s}
    idle-timeout: ${IM_GATEWAY_IDLE_TIMEOUT:75s}
    slow-connection-timeout: ${IM_GATEWAY_SLOW_CONNECTION_TIMEOUT:10s}
    boss-threads: ${IM_GATEWAY_BOSS_THREADS:1}
    worker-threads: ${IM_GATEWAY_WORKER_THREADS:8}
    business-threads: ${IM_GATEWAY_BUSINESS_THREADS:8}
    business-queue-capacity: ${IM_GATEWAY_BUSINESS_QUEUE_CAPACITY:1024}
    max-frame-bytes: ${IM_GATEWAY_MAX_FRAME_BYTES:65536}
    write-low-watermark-bytes: ${IM_GATEWAY_WRITE_LOW_WATERMARK_BYTES:32768}
    write-high-watermark-bytes: ${IM_GATEWAY_WRITE_HIGH_WATERMARK_BYTES:131072}
    max-pending-outbound-bytes: ${IM_GATEWAY_MAX_PENDING_OUTBOUND_BYTES:262144}
    max-connection-in-flight: ${IM_GATEWAY_MAX_CONNECTION_IN_FLIGHT:16}
    max-gateway-in-flight: ${IM_GATEWAY_MAX_IN_FLIGHT:1024}
    operations-per-second: ${IM_GATEWAY_OPERATIONS_PER_SECOND:30}
    operation-burst: ${IM_GATEWAY_OPERATION_BURST:60}
  storage:
    root: ${IM_STORAGE_ROOT:./data/attachments}
    max-attachment-bytes: ${IM_MAX_ATTACHMENT_BYTES:26214400}
    upload-ttl: ${IM_UPLOAD_TTL:1h}
  auth:
    issuer: ${IM_AUTH_ISSUER:im-local}
    jwt-secret: ${IM_AUTH_JWT_SECRET:local-development-secret-change-me-32-bytes}
    access-token-ttl: ${IM_AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${IM_AUTH_REFRESH_TOKEN_TTL:30d}
  routing:
    slot-count: 1024
    table-group-count: 8
    hash-seed: 0
    local-shard-id: ${IM_LOCAL_SHARD_ID:shard-0}
  message:
    automatic-retry-window: 24h
    max-clock-skew: 5m
  rocketmq:
    enabled: ${IM_ROCKETMQ_ENABLED:false}
    endpoints: ${IM_ROCKETMQ_ENDPOINTS:127.0.0.1:8081}
    message-topic: ${IM_ROCKETMQ_MESSAGE_TOPIC:im-message-events}
    membership-topic: ${IM_ROCKETMQ_MEMBERSHIP_TOPIC:im-membership-events}
    producer-identity: ${IM_ROCKETMQ_PRODUCER_IDENTITY:im-outbox-publisher}
    outbox-batch-size: ${IM_OUTBOX_BATCH_SIZE:200}
    outbox-max-in-flight: ${IM_OUTBOX_MAX_IN_FLIGHT:2000}
    outbox-lease: ${IM_OUTBOX_LEASE:30s}
    outbox-max-attempts: ${IM_OUTBOX_MAX_ATTEMPTS:100}
    outbox-poll-interval-ms: ${IM_OUTBOX_POLL_INTERVAL_MS:100}

